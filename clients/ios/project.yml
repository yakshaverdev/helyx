name: Helyx
options:
  bundleIdPrefix: dev.helyx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # The library is built for aarch64 only (aarch64-apple-ios-sim and
    # aarch64-apple-ios), so the simulator build is arm64, not x86_64.
    ARCHS: arm64
targets:
  Helyx:
    type: application
    platform: iOS
    sources:
      - path: Helyx
      - path: Bindings/helyx_client_ffi.swift
    settings:
      base:
        PRODUCT_NAME: Helyx
        PRODUCT_BUNDLE_IDENTIFIER: dev.helyx.app
        INFOPLIST_KEY_CFBundleDisplayName: $(PRODUCT_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: The app connects to your Helyx server on the local network.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Bindings
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Rust
        OTHER_LDFLAGS:
          - -lhelyx_client_ffi
  HelyxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HelyxTests
    dependencies:
      - target: Helyx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.helyx.app.tests
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Bindings
schemes:
  Helyx:
    build:
      targets:
        Helyx: all
        HelyxTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HelyxTests
