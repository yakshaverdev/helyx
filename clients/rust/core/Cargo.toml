[package]
name = "helyx-client-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The client core of Helyx: the frame checks of the wire protocol, the handshake, and the event fold"
publish = false

[dependencies]
base64 = "0.22"
hmac = "0.12"
num-bigint = { version = "0.4", default-features = false }
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
